name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: false
        type: string

permissions:
  contents: write
  discussions: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.audio-commit.outputs.sha || steps.deployment-commit.outputs.sha }}
      hub_enabled: ${{ steps.hub-settings.outputs.enabled }}
      hub_url: ${{ steps.hub-settings.outputs.hub_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate launch configuration
        run: npm run site:check

      - name: Prepare content according to authoring policy
        run: npm run content:prepare

      - name: Persist immutable post IDs
        run: |
          if [ -z "$(git status --porcelain -- content/posts content/translations)" ]; then
            echo "No post IDs to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts content/translations
          git commit -m "chore(content): add immutable post IDs [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Detect changed source posts
        id: changed-posts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: |
          changed_posts_file="$RUNNER_TEMP/changed-posts.nul"
          : > "$changed_posts_file"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "No changed source posts for this event."
          elif [ "$FORCED_PUSH" = "true" ]; then
            echo "History was rewritten. Skip post release sync; continue site deployment."
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # fetch-depth: 0 fetches reachable history, not commits removed by a
            # rewrite. Never fetch the deleted history just to generate releases.
            if [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA"; then
              git diff --diff-filter=ACMRT --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- 'content/posts/*.md' > "$changed_posts_file"
            else
              echo "Previous history is unavailable or was rewritten. Skip post release sync; continue site deployment."
            fi
          else
            git diff-tree --root --diff-filter=ACMRT --no-commit-id --name-only -r -z "$GITHUB_SHA" -- 'content/posts/*.md' > "$changed_posts_file"
          fi

          if [ -s "$changed_posts_file" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read public release settings
        id: release-settings
        run: |
          value=false

          if [ -f .env.production ]; then
            matched=$(grep -E '^PUBLIC_RELEASE_USE_TRANSLATIONS=' .env.production | tail -n 1 | cut -d= -f2- || true)
            if [ -n "$matched" ]; then
              value=$(printf '%s' "$matched" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
            fi
          fi

          echo "use_translations=$value" >> "$GITHUB_OUTPUT"

      - name: Translate content
        run: npm run translate:content
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_API_URL: ${{ secrets.DEEPL_API_URL }}

      - name: Commit translated content
        run: |
          if [ -z "$(git status --porcelain -- content/translations content/taxonomy.json)" ]; then
            echo "No translated content changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translations
          if [ -f content/taxonomy.json ]; then git add content/taxonomy.json; fi
          git commit -m "chore(i18n): sync translations [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Sync giscus discussions
        run: node ./scripts/sync-giscus-discussions.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployed commit
        id: deployment-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read feed participation settings
        id: hub-settings
        run: node scripts/hub-settings.mjs

      - name: Build site
        run: npm run build
        env:
          GITBLOG_BUILD_COMMIT: ${{ steps.deployment-commit.outputs.sha }}
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Inspect TTS work
        id: tts
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('build/.well-known/tts-input.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'enabled='+d.posts.some(p=>p.enabled)+'\n')"

      - name: Setup Python for CPU speech
        if: steps.tts.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/tts/requirements.txt

      - name: Cache pinned Supertonic model
        if: steps.tts.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/supertonic3
          key: supertonic3-aafc6e32416a594460b32413efc49d7fe4ce6d46

      - name: Generate repository audio
        if: steps.tts.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python -m pip install -r scripts/tts/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python scripts/tts/setup.py
          python scripts/tts/generate.py
        env:
          TTS_THREADS: '2'

      - name: Persist generated audio
        if: steps.tts.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/audio
          if ! git diff --cached --quiet; then
            git commit -m "chore(audio): generate article speech [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Record audio commit
        id: audio-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild with available audio
        if: steps.tts.outputs.enabled == 'true'
        run: npm run build
        env:
          GITBLOG_BUILD_COMMIT: ${{ steps.audio-commit.outputs.sha }}
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Keep speech inputs and files out of Pages
        run: rm -f build/.well-known/tts-input.json

      - name: Verify feed manifest
        run: test -f build/.well-known/blog-hub.json

      - name: Save expected discovery policy for deployment checks
        uses: actions/upload-artifact@v4
        with:
          name: discovery-check
          path: build/.well-known/ai-discovery.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Sync post releases
        if: steps.changed-posts.outputs.has_changes == 'true'
        run: node ./scripts/sync-post-releases.mjs
        env:
          CHANGED_POST_FILES_PATH: ${{ runner.temp }}/changed-posts.nul
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_USE_TRANSLATIONS: ${{ steps.release-settings.outputs.use_translations }}

      # upload-pages-artifact excludes all dot directories, including .well-known.
      - name: Package Pages including public manifest
        run: |
          tar --dereference --hard-dereference --directory build \
            --exclude=.git --exclude=.github --exclude='.env*' \
            -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" ./.well-known/blog-hub.json > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  discovery:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: discovery-check
          path: build/.well-known
      - name: Check deployed crawl access
        run: npm run discovery:check -- --live
      - name: Save crawl access results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-audit
          path: discovery-audit-live.json
          retention-days: 14
          if-no-files-found: warn

  register:
    needs: [build, deploy]
    if: needs.build.outputs.hub_enabled == 'true'
    uses: gitblogapp/svelte-gitblog-template/.github/workflows/register-blog.yml@5e94932e25fc5e048ff43cfe5b806579948a549c
    permissions:
      contents: read
      pages: read
      id-token: write
    with:
      hub_url: ${{ needs.build.outputs.hub_url }}
      commit_sha: ${{ needs.build.outputs.commit_sha }}
