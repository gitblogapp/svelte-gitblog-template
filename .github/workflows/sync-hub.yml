name: Sync GitBlog feed
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
  id-token: write
jobs:
  settings:
    if: github.event.repository.is_template != true && github.repository != 'gitblogapp/svelte-gitblog-template-dev'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.settings.outputs.enabled }}
      hub_url: ${{ steps.settings.outputs.hub_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: settings
        run: node scripts/hub-settings.mjs
  register:
    needs: settings
    if: needs.settings.outputs.enabled == 'true'
    uses: gitblogapp/svelte-gitblog-template/.github/workflows/register-blog.yml@032838d5374d380d9bb87c278b04addf21dea406
    with:
      hub_url: ${{ needs.settings.outputs.hub_url }}
