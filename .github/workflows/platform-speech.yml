name: GitBlog platform speech

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gitblog-platform-speech
  cancel-in-progress: false

jobs:
  speech:
    # This central queue belongs to GitBlog. Copies in user blogs must not run it.
    if: github.repository == 'gitblogapp/svelte-gitblog-template' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check for pending work before downloading the model
        id: queue
        run: |
          python -m unittest discover -s tests/tts
          python scripts/tts/platform-worker.py claim
      - uses: actions/cache@v4
        if: steps.queue.outputs.pending == 'true'
        with:
          path: .cache/supertonic3
          key: supertonic3-aafc6e32416a594460b32413efc49d7fe4ce6d46
      - name: Install CPU speech dependencies
        if: steps.queue.outputs.pending == 'true'
        run: |
          python -m pip install -r scripts/tts/requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python scripts/tts/setup.py
      - name: Generate compressed excerpts and return them to GitBlog
        if: steps.queue.outputs.pending == 'true'
        run: python scripts/tts/platform-worker.py run
        env:
          TTS_THREADS: '4'
